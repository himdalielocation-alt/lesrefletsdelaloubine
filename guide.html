    <title>Guide du séjour — Les Reflets de la Loubine</title>
    <meta name="theme-color" content="#134a52">
    <link rel="icon" type="image/svg+xml" href="brand/logos/avatar-rond.svg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bleu-loubine': 'var(--bleu-loubine)',
                        'bleu-estran': 'var(--bleu-estran)',
                        'reflet': 'var(--reflet)',
                        'ecume': 'var(--ecume)',
                        'sable': 'var(--sable)',
                        'blanc-coquille': 'var(--blanc-coquille)',
                        'dune': 'var(--dune)',
                        'encre': 'var(--encre)',
                        'encre-douce': 'var(--encre-douce)',
                        'nuit': 'var(--nuit)',
                        'tamaris': 'var(--tamaris)',
                        'tamaris-pale': 'var(--tamaris-pale)',
                        'varech': 'var(--varech)',

                    },
                    fontFamily: {
                        titre: ['Fraunces Reflets', 'Georgia', 'Times New Roman', 'serif'],
                        texte: ['Karla Reflets', 'Helvetica Neue', 'Arial', 'sans-serif'],

                    borderRadius: {
                        'rayon-sm': '6px',
                        'rayon-md': '12px',
                        'rayon-lg': '20px',
                        'rayon-pilule': '999px',
                    },
                    boxShadow: {
                        posee: 'var(--ombre-posee)',
                        relief: 'var(--ombre-relief)',
                    },
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @font-face {
            font-family: 'Fraunces Reflets';
            src: url('fonts/Fraunces-Reflets.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Karla Reflets';
            src: url('fonts/Karla-Reflets.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bleu-loubine: #134a52;
            --bleu-estran: #2e747a;
            --reflet: #a9ced0;
            --ecume: #fbf8f2;
            --sable: #f1e8d8;
            --blanc-coquille: #ffffff;
            --dune: #d9c9ae;
            --encre: #12211f;
            --encre-douce: #4c5a58;
            --nuit: #0c1719;
            --tamaris: #a8493f;
            --tamaris-pale: #f6e3dd;
            --varech: #3e6b4f;
            --ajonc: #d9a441;
            --ombre-posee: 0 1px 2px rgba(18,33,31,0.05), 0 6px 20px rgba(18,33,31,0.07);
            --ombre-relief: 0 12px 40px rgba(18,33,31,0.14);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bleu-loubine: #8fc3c6;
                --bleu-estran: #5ea3a8;
                --reflet: #2f585d;
                --ecume: #0f1b1e;
                --sable: #17272b;
                --blanc-coquille: #14242a;
                --dune: #2c4045;
                --encre: #f4efe6;
                --encre-douce: #b9c5c2;
                --nuit: #06100f;
                --tamaris: #e9a196;
                --tamaris-pale: #38251f;
                --varech: #86b694;
                --ajonc: #e6bd67;
                --ombre-posee: 0 1px 2px rgba(0,0,0,0.5), 0 6px 20px rgba(0,0,0,0.45);
                --ombre-relief: 0 12px 40px rgba(0,0,0,0.6);
            }
        }

        body { font-family: 'Karla Reflets', 'Helvetica Neue', Arial, sans-serif; background: var(--ecume); color: var(--encre); }

        .affiche { font-family: 'Fraunces Reflets', Georgia, 'Times New Roman', serif; font-weight: 600; font-size: 32px; line-height: 36px; letter-spacing: -0.01em; }
        @media (min-width: 640px) { .affiche { font-size: 44px; line-height: 46px; } }
        .titre-1 { font-family: 'Fraunces Reflets', Georgia, 'Times New Roman', serif; font-weight: 600; font-size: 27px; line-height: 32px; }
        .titre-2 { font-family: 'Fraunces Reflets', Georgia, 'Times New Roman', serif; font-weight: 600; font-size: 22px; line-height: 28px; }
        .titre-3 { font-family: 'Fraunces Reflets', Georgia, 'Times New Roman', serif; font-weight: 600; font-size: 18px; line-height: 24px; }
        .chapo { font-weight: 400; font-size: 17px; line-height: 27px; }
        .corps { font-weight: 400; font-size: 16px; line-height: 26px; }
        .corps-fort { font-weight: 600; font-size: 16px; line-height: 26px; }
        .legende { font-weight: 400; font-size: 13.5px; line-height: 20px; color: var(--encre-douce); }
        .surtitre { font-weight: 700; font-size: 12px; line-height: 16px; letter-spacing: 0.18em; text-transform: uppercase; }

        .btn-focus:focus-visible { outline: 2px solid var(--bleu-estran); outline-offset: 3px; }

        .tab-btn {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--dune);
            color: var(--encre-douce);
            background: var(--blanc-coquille);
            transition: all .15s ease;
        }
        .tab-btn[aria-selected="true"] {
            background: var(--bleu-loubine);
            border-color: var(--bleu-loubine);
            color: var(--ecume);
        }
        .tab-panel[hidden] { display: none; }

        html:not(.content-ready) #guideContent { display: none; }
        html.content-ready #gate { display: none; }

        .spinner {
            width: 18px; height: 18px; border-radius: 999px;
            border: 2px solid currentColor; border-top-color: transparent;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">

    <!-- ============ PORTE D'ACCÈS (mot de passe) ============ -->
    <div id="gate" class="min-h-screen flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <img src="brand/logos/avatar-rond.svg" alt="" class="w-14 h-14 mx-auto mb-4 rounded-full">
                <h1 class="titre-2 text-encre mb-2">Guide du séjour</h1>
                <p class="corps text-encre-douce">Les Reflets de la Loubine</p>
            </div>
            <form id="gateForm" class="bg-blanc-coquille border border-dune rounded-rayon-lg p-6 shadow-posee" novalidate>
                <label for="gatePassword" class="corps-fort text-encre block mb-2">Mot de passe</label>
                <p class="legende mb-3">Communiqué à la confirmation de votre réservation.</p>
                <input
                    type="password"
                    id="gatePassword"
                    name="gatePassword"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    class="btn-focus w-full corps px-4 py-3 rounded-rayon-md border border-dune bg-ecume text-encre mb-4"
                    placeholder="••••••••"
                >
                <button
                    type="submit"
                    id="gateSubmit"
                    class="btn-focus w-full inline-flex items-center justify-center gap-2 bg-bleu-loubine hover:bg-bleu-estran text-ecume corps-fort px-6 py-3 rounded-rayon-md transition"
                >
                    <span id="gateSubmitLabel">Accéder au guide</span>
                </button>
                <p id="gateError" class="legende mt-3 hidden" style="color: var(--tamaris);" role="alert"></p>
            </form>
        </div>
    </div>

        function base64ToBytes(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function normalizePassword(raw) {
            return raw.trim().toLowerCase();
        }

        async function deriveKey(password, saltBytes, iterations) {
            const baseKey = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function tryDecrypt(rawPassword) {
            const password = normalizePassword(rawPassword);
            const salt = base64ToBytes(CRYPTO_PAYLOAD.salt);
            const iv = base64ToBytes(CRYPTO_PAYLOAD.iv);
            const ciphertext = base64ToBytes(CRYPTO_PAYLOAD.ciphertext);
            const key = await deriveKey(password, salt, CRYPTO_PAYLOAD.iterations);
            const plainBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
            return new TextDecoder().decode(plainBuffer);
        }

        function initGuideInteractions() {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    buttons.forEach((b) => {
                        b.setAttribute('aria-selected', 'false');
                        const panel = document.getElementById('tab-' + b.dataset.tab);
                        if (panel) panel.hidden = true;
                    });
                    btn.setAttribute('aria-selected', 'true');
                    const panel = document.getElementById('tab-' + btn.dataset.tab);
                    if (panel) panel.hidden = false;
                });
            });
            if (window.lucide) lucide.createIcons();
        }

        const gateForm = document.getElementById('gateForm');
        const gatePassword = document.getElementById('gatePassword');
        const gateError = document.getElementById('gateError');
        const gateSubmit = document.getElementById('gateSubmit');
        const gateSubmitLabel = document.getElementById('gateSubmitLabel');

        gateForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            gateError.classList.add('hidden');
            gateSubmit.disabled = true;
            gateSubmitLabel.innerHTML = '<span class="spinner"></span>';

            try {
                const html = await tryDecrypt(gatePassword.value);
                document.getElementById('guideContent').innerHTML = html;
                document.documentElement.classList.add('content-ready');
                initGuideInteractions();
                window.scrollTo(0, 0);
            } catch (err) {
                gateError.textContent = 'Mot de passe incorrect. Vérifiez la casse et les espaces, puis réessayez.';
                gateError.classList.remove('hidden');
                gatePassword.value = '';
                gatePassword.focus();
            } finally {
                gateSubmit.disabled = false;
                gateSubmitLabel.textContent = 'Accéder au guide';
            }
        });

        gatePassword.focus();
    </script>
