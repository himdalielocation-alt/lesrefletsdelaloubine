name: 📅 Synchroniser le Calendrier

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: |
          python -m pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client
      
      - name: Synchroniser
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync-calendar.py
      
      - name: Commit et push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add data/calendar.json
          git commit -m "🔄 Sync calendrier ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main || true
