name: 🧩 Générer les pages depuis les templates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'images/photos/**'
      - 'data/photos.json'
      - 'scripts/build_pages.py'

# Plusieurs photos envoyées d'affilée déclenchent plusieurs exécutions :
# elles passent l'une après l'autre, chacune repartant de la dernière version de main.
concurrency:
  group: build-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Générer les pages
        run: python3 scripts/build_pages.py

      - name: Commit et push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          for f in templates/pages/*.html; do
            git add "$(basename "$f")"
          done
          for lang in en de; do
            for f in templates/pages/$lang/*.html; do
              git add "$lang/$(basename "$f")"
            done
          done
          git add sitemap.xml
          git commit -m "🧩 Régénérer les pages (build_pages.py)" || true
          git pull --rebase origin main || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main || true
