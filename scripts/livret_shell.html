<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#134a52">
<title>Livret d’accueil — Les Reflets de la Loubine</title>
<link rel="icon" type="image/svg+xml" href="/brand/logos/avatar-rond.svg">
<!--
  Livret d'accueil des voyageurs. Page non liée depuis le site, absente du sitemap,
  non indexée. Son contenu est chiffré (AES-GCM 256) : la clé n'est PAS dans le dépôt,
  elle se trouve uniquement après le # de l'URL donnée aux voyageurs (QR code), et le
  navigateur ne l'envoie jamais au serveur. Généré par scripts/livret.py — ne pas
  éditer le bloc LIVRET_PAYLOAD à la main.
-->
<style>
@font-face { font-family: 'Fraunces Reflets'; src: url('/fonts/Fraunces-Reflets.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Karla Reflets'; src: url('/fonts/Karla-Reflets.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
:root { --bleu: #134a52; --estran: #2e747a; --reflet: #a9ced0; --ecume: #fbf8f2; --sable: #f1e8d8; --coquille: #ffffff; --dune: #d9c9ae;
        --encre: #12211f; --douce: #4c5a58; --tamaris: #a8493f; --varech: #3e6b4f; --ajonc: #d9a441; color-scheme: light; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { margin: 0; background: var(--ecume); color: var(--encre); font: 400 16px/1.6 'Karla Reflets', 'Helvetica Neue', Arial, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
a { color: var(--estran); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; border-radius: 4px; }
p { margin: 0 0 12px; }
.l-h1, .l-h2, .l-h3 { font-family: 'Fraunces Reflets', Georgia, serif; color: var(--bleu); font-weight: 600; margin: 0; }
.l-h1 { font-size: 36px; line-height: 1.1; margin: 8px 0 12px; }
.l-h2 { font-size: 28px; line-height: 1.2; }
.l-h3 { font-size: 19px; line-height: 1.3; color: var(--encre); margin-bottom: 8px; }
.l-kicker { font: 700 12px/1.4 'Karla Reflets', Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--bleu); margin: 0 0 6px; }
.l-chapo { font-size: 18px; line-height: 1.6; }
.l-legende { font-size: 14px; color: var(--douce); }
.l-big { font-weight: 700; font-size: 18px; color: var(--bleu); margin-bottom: 4px; }
.l-mono { letter-spacing: .03em; }
.l-mt { margin-top: 28px; }
.l-filet { width: 120px; height: 10px; margin: 12px 0 20px; background: linear-gradient(var(--bleu), var(--bleu)) 0 2px / 100% 2px no-repeat, repeating-linear-gradient(90deg, var(--bleu) 0 18px, transparent 18px 28px) 0 7px / 100% 2px no-repeat; opacity: .9; }
.l-cover { text-align: center; padding: 40px 0 24px; }
.l-logo { width: 220px; height: auto; margin-bottom: 20px; }
.l-nav { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; margin: 0 -16px 8px; background: rgba(251,248,242,.96); border-bottom: 1px solid var(--dune); scrollbar-width: none; }
.l-nav::-webkit-scrollbar { display: none; }
.l-nav a { flex: 0 0 auto; padding: 6px 12px; border: 1px solid var(--dune); border-radius: 999px; background: var(--coquille); color: var(--bleu); font-weight: 600; font-size: 14px; text-decoration: none; }
.l-section { padding: 36px 0 12px; border-bottom: 1px solid var(--dune); }
.l-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 12px 0; }
@media (min-width: 640px) { .l-grid { grid-template-columns: 1fr 1fr; } .l-h1 { font-size: 46px; } .l-h2 { font-size: 34px; } }
.l-card { background: var(--coquille); border: 1px solid var(--dune); border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
.l-grid .l-card { margin: 0; }
.l-card p:last-child, .l-note p:last-child { margin-bottom: 0; }
.l-card-main { border: 2px solid var(--bleu); }
.l-note { background: var(--sable); border-radius: 14px; padding: 16px 18px; margin: 16px 0; }
.l-note-reflet { background: #e6f0f0; }
.l-note-ajonc { background: var(--ajonc); color: var(--encre); }
.l-tags, .l-badges { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0 0 10px; }
.l-tags li, .l-badges span { background: var(--sable); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; color: var(--encre); }
.l-urg { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.l-urg a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: var(--coquille); border: 1px solid var(--dune); text-decoration: none; color: var(--douce); font-size: 13px; line-height: 1.35; }
.l-urg strong { font: 600 30px/1 'Fraunces Reflets', Georgia, serif; color: var(--tamaris); }
.l-check { list-style: none; padding: 0; margin: 8px 0; }
.l-check li { position: relative; padding: 6px 0 6px 32px; border-bottom: 1px solid #ece3d3; }
.l-check li::before { content: ""; position: absolute; left: 0; top: 9px; width: 18px; height: 18px; border: 2px solid var(--bleu); border-radius: 5px; }
.l-tri { display: grid; gap: 10px; margin: 16px 0; }
.l-tri > div { display: flex; gap: 12px; align-items: flex-start; background: var(--coquille); border: 1px solid var(--dune); border-radius: 12px; padding: 12px 14px; }
.l-tri p { margin: 0; }
.l-pastille { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; }
.l-ol { padding-left: 22px; margin: 8px 0; } .l-ol li { margin-bottom: 8px; }
.l-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.l-sw { display: inline-block; width: 26px; height: 14px; border-radius: 4px; border: 1.5px solid var(--bleu); }
.l-sw-depart { background: #e3eeee; border-color: #a9ced0; } .l-sw-arrivee { background: var(--reflet); }
.l-arrow { color: var(--bleu); font-weight: 700; }
.l-steps { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 20px; }
.l-illu { background: var(--sable); border-radius: 14px; padding: 10px; }
.l-illu svg { display: block; width: 100%; height: auto; max-height: 300px; }
.l-step-txt { display: flex; gap: 14px; margin-top: 12px; }
.l-num { font: 600 38px/1 'Fraunces Reflets', Georgia, serif; color: var(--bleu); }
.l-facts { margin: 10px 0; }
.l-facts > div { display: grid; grid-template-columns: minmax(96px, 34%) 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid #ece3d3; }
.l-facts dt { font-weight: 700; color: var(--bleu); font-size: 14px; }
.l-facts dd { margin: 0; }
.l-wifi { display: grid; gap: 10px; margin: 12px 0 16px; }
.l-wifi > div { background: var(--coquille); border: 2px solid var(--bleu); border-radius: 14px; padding: 14px 16px; }
.l-wifi .l-big { font-size: 22px; margin: 0; word-break: break-word; }
.l-km { list-style: none; padding: 0; margin: 16px 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: center; }
@media (min-width: 640px) { .l-km { grid-template-columns: repeat(4, 1fr); } }
.l-km li { background: var(--coquille); border: 1px solid var(--dune); border-radius: 12px; padding: 10px; }
.l-km strong { display: block; font: 600 26px/1.1 'Fraunces Reflets', Georgia, serif; color: var(--bleu); }
.l-km span { font-size: 13px; color: var(--douce); }
.l-plan { margin: 0 0 8px; overflow-x: auto; }
.l-plan img { display: block; width: 100%; min-width: 560px; height: auto; border-radius: 14px; }
.l-signature { margin-top: 16px; }
.l-swipe { margin-top: 4px; }
@media (min-width: 600px) { .l-swipe { display: none; } .l-plan img { min-width: 0; } }
.l-end { text-align: center; padding: 40px 0 0; }
.l-tel { font-weight: 700; white-space: nowrap; }
#verrou { max-width: 420px; margin: 0 auto; padding: 80px 16px; text-align: center; }
#verrou img { width: 64px; height: 64px; margin-bottom: 16px; }
@media print { .l-nav { display: none; } .l-section { break-inside: avoid-page; } }
</style>
</head>
<body>
<main id="livret" aria-live="polite">
  <div id="verrou">
    <img src="/brand/logos/avatar-rond.svg" alt="">
    <h1 class="l-h2">Livret d’accueil</h1>
    <p id="verrou-msg" class="l-legende">Ouverture du livret…</p>
  </div>
</main>
<script>
  const LIVRET_PAYLOAD = {{PAYLOAD}};
  (async function () {
    const msg = document.getElementById('verrou-msg');
    const fail = () => {
      msg.innerHTML = 'Ce livret est réservé aux voyageurs des Reflets de la Loubine. Scannez le QR code présent dans l’appartement pour l’ouvrir.<br><br><a href="/">Découvrir l’appartement</a>';
    };
    try {
      const m = location.hash.match(/k=([A-Za-z0-9_-]{43})/);
      if (!m || !window.crypto || !crypto.subtle) return fail();
      const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), (c) => c.charCodeAt(0));
      const key = await crypto.subtle.importKey('raw', b64(m[1]), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LIVRET_PAYLOAD.iv) }, key, b64(LIVRET_PAYLOAD.ct));
      document.getElementById('livret').innerHTML = new TextDecoder().decode(plain);
      const ancre = location.hash.match(/#(?:.*&)?a=([\w-]+)/);
      if (ancre && document.getElementById(ancre[1])) document.getElementById(ancre[1]).scrollIntoView();
      // Liens du sommaire : garder la clé dans l'URL (les ancres #section la remplaceraient).
      document.querySelectorAll('#livret a[href^="#"]').forEach((a) => a.addEventListener('click', (e) => {
        const cible = document.getElementById(a.getAttribute('href').slice(1));
        if (cible) { e.preventDefault(); cible.scrollIntoView(); }
      }));
    } catch (e) { fail(); }
  })();
</script>
</body>
</html>
